# Mangom72 실사용 설정
#
# 목적: 레포가 삭제되거나 계정이 정지돼도 코드를 되살릴 수 있게 한다.
#       (Claude 클라우드에서 작업해 로컬에 사본이 없으므로 GitHub 가 유일본)
#
# 그래서 기본값은 "코드와 함께 사라지고, 다시 만들 수 없는 것" 만 가져옵니다.
# 나머지는 전부 꺼져 있고, 아래에서 false -> true 한 줄만 바꾸면 켜집니다.
# 전체 옵션 설명은 config.example.yaml 참고.

github:
  token_env: GITHUB_TOKEN
  include_owned: true          # 내가 소유한 레포 전부
  include_collaborator: false
  include_orgs: []
  include: []                  # 비워두면 전부. 새로 만든 레포도 자동 포함됩니다.
  exclude: []
  include_forks: false
  include_archived: true
  include_private: true

collect:
  # ─────────────────────────────────────────────
  # 핵심: 이게 없으면 코드를 못 되살립니다
  # ─────────────────────────────────────────────
  git: true                  # 전체 히스토리 (모든 브랜치·태그·노트) -> repo.bundle
  wiki: true                 # 위키도 별도 git 저장소라 레포와 함께 사라집니다
  repo_meta: true            # 설명·기본 브랜치·토픽·README (레포 재생성에 필요)
  releases: true             # 릴리스 노트
  release_assets: true       # 첨부 바이너리 - 소스에서 다시 만들 수 없는 산출물
  release_asset_max_mb: 0    # 0 = 크기 제한 없음

  # ─────────────────────────────────────────────
  # 여기부터는 전부 선택. 필요한 줄만 true 로 바꾸세요.
  # ─────────────────────────────────────────────

  # 이슈·PR 대화 기록. 켜면 백업 시간이 가장 많이 늘어납니다
  # (PR 1건당 API 2회). 끄면 레포가 사라질 때 대화 기록도 함께 사라집니다.
  issues: false
  issue_comments: false
  issue_events: false
  pulls: false
  pull_reviews: false
  pull_review_comments: false
  pull_commits: false
  discussions: false

  # 레포 부가 정보 (대부분 git 번들 안에 이미 들어 있거나 재생성 가능)
  labels: false
  milestones: false
  tags: false
  branches: false
  commit_comments: false
  contributors: false
  collaborators: false
  workflows: false

  # 무거운 것들
  git_pull_refs: false       # refs/pull/* - 삭제된 PR 브랜치까지. 용량 증가
  git_lfs: false             # LFS 를 쓰는 레포가 있다면 켜세요
  stargazers: false
  watchers: false
  forks: false
  webhooks: false            # admin 권한 필요
  workflow_runs: false       # CI 실행 이력
  workflow_runs_limit: 500
  deployments: false
  environments: false
  projects_v2: false         # 토큰에 read:project 필요
  traffic: false             # push 권한 필요. GitHub 는 14일치만 제공

  # 계정 단위 (레포와 별개로 사라질 수 있는 것들)
  account_profile: false
  account_gists: false       # gist 본문까지. 켤 만한 값어치가 있습니다
  account_starred: false
  account_following: false

output:
  # mirror = 사본 하나를 계속 갱신. 용량이 회차만큼 불어나지 않고,
  #          GitHub 에서 사라진 것은 미러에 남습니다.
  # snapshot = 시점별 사본 여러 개. "그때 그 상태" 로 되돌려야 할 때만.
  mode: mirror
  dir: ./backups
  work_dir: ./work
  keep_local: true           # Actions 워크플로가 실행 시 false 로 덮어씁니다

  # 아래 네 개는 snapshot 모드에서만 쓰입니다.
  archive: true
  compression: gz
  snapshot_name: "%Y-%m-%dT%H-%M-%SZ"
  stream_upload: true

storage:
  backend: rclone
  rclone:
    binary: rclone
    remote: "gdrive:"
    path: "Checkpoint/github-backups"
    extra_args: ["--transfers=4", "--checkers=8", "--drive-chunk-size=64M"]

# snapshot 모드 전용. mirror 모드는 아무것도 지우지 않으므로 무시됩니다.
retention:
  keep_last: 14
  keep_daily: 30
  keep_weekly: 12
  keep_monthly: 24
  prune_remote: true
  prune_local: true

runtime:
  concurrency: 4
  request_timeout: 60
  max_retries: 6
  incremental: false
  state_file: .checkpoint-state.json
  log_level: INFO
  redact_repo_names: true    # 로그에서 레포 이름을 repo#01 로 가립니다.
                             # 이 레포를 public 으로 두면 Actions 로그가 공개되므로.
  fail_fast: false
